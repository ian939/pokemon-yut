function persist() {
  const s = G.s;
  if (s.phase === "over") {
    if (!s.recorded) {
      s.recorded = true;
      const w = s.teams[s.winner];
      const st = Store.data.stats;
      st.games = (st.games || 0) + 1;
      if (s.settings.mode === "rocket") { if (w.cpu) st.rocket.lose++; else st.rocket.win++; }
      else st.family[w.key] = (st.family[w.key] || 0) + 1;
      if (s.settings.mode === "rocket" && !w.cpu) {
        const forced = (Q.get("box") || "").split(",").filter(b => Yut.Rewards.BALL_INFO[b]); // 테스트용 ?box=master,poke,great
        const balls = forced.length ? forced : Yut.Rewards.rollBox(Yut.Rewards.BOX_SIZE, Math.random);
        balls.forEach(b => { Store.data.bag[b] = (Store.data.bag[b] || 0) + 1; });
        s.reward = { balls, opened: false };
        st.boxes = (st.boxes || 0) + 1;
      }
    }
    Store.data.game = null;
    Store.data.lastGame = s;
  } else Store.data.game = s;
  Store.save();
}

// 이번 판 포켓몬의 모든 진화 모습(앞·뒤)을 미리 불러 둔다 — 진화·배틀 때 깜빡이지 않게
function preloadSprites(s) {
  const seen = {};
  s.teams.forEach(t => t.paths.forEach(p => p.forEach(id => {
    if (seen[id]) return;
    seen[id] = 1;
    [frontUrl(id), "assets/sprites/back/" + id + ".png"].forEach(u => { const im = new Image(); im.src = u; });
  })));
}
function mountGame() {
  G.busy = false; G.sel = null; G.newPick = null; G.paused = false;
  preloadSprites(G.s);
  renderAll();
  try { history.pushState({ yut: "game" }, ""); } catch (e) {}
  if (G.s.intro) {
    delete G.s.intro;
    persist();
    G.busy = true;
    renderTop();
    (async () => {
      if (G.s.settings.mode === "rocket") await rocketIntro();
      await announceStartSkills();
      await announceTurn(G.s.turn, true);
      G.busy = false;
      afterAction();
    })();
  } else {
    toast("이어서 해요! 🎲");
    afterAction();
  }
}

function afterAction() {
  if (current !== "game" || !G.s) return;
  G.target = null;
  renderAll();
  G.moves = Yut.legalMoves(G.s);
  if (G.s.phase === "over") { hint(""); return; }
  if (G.paused) return;
  if (G.s.phase === "choose") {
    if (humanTurn()) prepareChoose();
    else { hint("😈 로켓단이 생각하는 중…"); cpuTick(); }
  } else {
    hint(humanTurn() ? "🎲 윷을 던져요!" + (G.s.settings.skills !== false && Yut.legalSkills(G.s).length ? " ✨ 기술도 쓸 수 있어요" : "") : "😈 로켓단 차례…");
    if (!humanTurn()) cpuTick();
  }
}

/* ---------- 말 고르기 ---------- */
function distinctDests(ms) {
  const by = {};
  ms.forEach(m => {
    const k = m.finish ? "goal" : String(m.to.node);
    if (!by[k] || (m.finish && m.result < by[k].result)) by[k] = m; // 골인은 가장 작은 결과로
  });
  return Object.keys(by).map(k => by[k]);
}
function prepareChoose() {
  const units = Array.from(new Set(G.moves.map(m => m.unit)));
  units.forEach(u => {
    if (u === "new") $$(".pchip.wait").filter(c => G.s.pieces[Number(c.dataset.piece)].team === G.s.turn).forEach(c => c.classList.add("can"));
    else { const el = unitAt(G.s.turn, u.slice(1)); if (el) el.classList.add("can"); }
  });
  if (units.length === 1) select(units[0]);
  hint(units.length === 1 ? "👆 반짝이는 칸을 눌러요" : "👆 움직일 말을 먼저 골라요");
}
function select(key, cpu) {
  G.sel = key;
  $$("#units .unit").forEach(el => el.classList.remove("sel"));
  $$(".pchip").forEach(c => c.classList.remove("selected"));
  if (key === "new") {
    const waiting = Yut.waitingOf(G.s, G.s.turn);
    if (G.newPick == null || waiting.indexOf(G.newPick) < 0) G.newPick = waiting[0];
    const c = $('.pchip[data-piece="' + G.newPick + '"]');
    if (c) c.classList.add("selected");
  } else {
    const el = unitAt(G.s.turn, key.slice(1));
    if (el) el.classList.add("sel");
  }
  showDests(G.moves.filter(m => m.unit === key), cpu);
  if (!cpu && key === "new") hint("👆 반짝이는 칸을 누르면 " + josa(nameOf(Yut.formOf(G.s, G.newPick)), "이/가") + " 출발해요");
}
function showDests(ms, cpu) {
  const box = $("#dests");
  if (!box) return;
  box.innerHTML = "";
  distinctDests(ms).forEach(m => {
    const b = document.createElement("button");
    const at = m.finish ? "goal" : m.to.node;
    b.className = "dest" + (m.finish ? " goal" : m.capture.length ? " hit" : m.result < 0 ? " back" : "") + (cpu ? " cpu" : "") +
      (nodeXY(at)[0] >= 90 ? " flip" : ""); // 판 오른쪽 끝 칸은 말풍선을 왼쪽에 (판 밖으로 잘리지 않게)
    placeAt(b, at);
    b.dataset.move = m.id;
    b.setAttribute("aria-label", m.finish ? "골인" : RES[m.result].name);
    const wild = !m.finish && (G.s.spots || []).some(sp => !sp.used && sp.node === m.to.node);
    b.innerHTML = "<b>" + (m.finish ? "🏁 골인!" : RES[m.result].name + (m.capture.length ? " 배틀!" : m.stack.length ? " 업기" : "") + (wild ? " 🌿" : "") + "<small>" + RES[m.result].steps + "</small>") + "</b>";
    b.addEventListener("click", ev => { ev.stopPropagation(); if (!G.busy && humanTurn()) doMove(m.id); });
    box.appendChild(b);
  });
}
function onUnitTap(el) {
  if (G.target) { const d = $('#dests .dest[data-node="' + el.dataset.node + '"]'); if (d) d.click(); else toast("반짝이는 곳을 눌러요 (취소하려면 ✖ 취소)"); return; }
  if (G.busy || !G.s || G.s.phase !== "choose" || !humanTurn()) return;
  if (Number(el.dataset.team) !== G.s.turn) { toast("그건 상대 팀 말이에요"); return; }
  const key = "n" + el.dataset.node;
  const ms = G.moves.filter(m => m.unit === key);
  if (!ms.length) { toast("이 말은 지금 못 움직여요"); return; }
  const ds = distinctDests(ms);
  if (G.sel === key && ds.length === 1) { doMove(ds[0].id); return; }
  SFX.tap();
  select(key);
}
function onChipTap(i) {
  if (G.target) {
    if (G.target.kind === "enemyPiece" && G.target.targets.indexOf(i) >= 0) doSkill(G.target.piece, i);
    else toast("반짝이는 곳을 눌러요 (취소하려면 ✖ 취소)");
    return;
  }
  if (G.busy || !G.s || G.s.phase !== "choose" || !humanTurn()) return;
  const p = G.s.pieces[i];
  if (p.team !== G.s.turn) { toast("그건 상대 팀 말이에요"); return; }
  if (p.state === "wait") {
    const ms = G.moves.filter(m => m.unit === "new");
    if (!ms.length) { toast(G.s.pending.every(r => r < 0) ? "빽도로는 새 말을 낼 수 없어요" : "지금은 새 말을 낼 수 없어요"); return; }
    const ds = distinctDests(ms);
    if (G.sel === "new" && G.newPick === i && ds.length === 1) { doMove(ds[0].id); return; }
    SFX.tap();
    G.newPick = i;
    select("new");
  } else if (p.state === "board") {
    const el = unitAt(p.team, Yut.posOf(p));
    if (el) onUnitTap(el);
  } else toast("벌써 골인했어요! 🏁");
}

/* ---------- 던지기 ---------- */
const Force = { q: (Q.get("force") || "").split(",").filter(Boolean).map(Number), next() { return this.q.length ? this.q.shift() : null; } };
async function doThrow() {
  if (G.busy || !G.s || G.s.phase !== "throw") return;
  G.busy = true;
  G.moves = [];
  renderTop();
  const r = Yut.applyThrow(G.s, Force.next());
  const t = r.events[0];
  G.s = r.state;
  persist();
  try {
    await animSticks(t.sticks);
    if (t.poisoned) { toast("☠️ 맹독! 윷이 " + josa(RES[t.result].name, "으로/로") + " 나왔어요…", 1600); TTS.say("맹독!"); await sleep(800); }
    if (t.rained) { toast("🌧️ 비의 힘! " + RES[t.rained].name + " → 개!", 1600); await sleep(800); }
    await showResult(t.result);
    if (t.again) { SFX.again(); await banner(RES[t.result].name + "! 한 번 더 던져요!", null, 1000, "gold"); }
    renderPending();
    await playEvents(r.events.slice(1), null);
  } catch (e) { console.error(e); }
  G.busy = false;
  afterAction();
}
async function animSticks(sticks) {
  const els = $$(".stick");
  SFX.rattle();
  els.forEach((el, i) => {
    el.style.setProperty("--d", (i * 0.05) + "s");
    el.style.setProperty("--r", (Math.random() * 30 - 15).toFixed(1) + "deg");
    el.classList.remove("toss"); void el.offsetWidth; el.classList.add("toss");
  });
  let k = 0;
  const iv = setInterval(() => { k++; els.forEach((el, i) => el.classList.toggle("flat", (k + i) % 2 === 0)); }, Math.max(30, 90 * SPEED));
  await sleep(720);
  clearInterval(iv);
  setSticks(sticks);
  SFX.land();
  await sleep(220);
}
function showResult(r) {
  return new Promise(res => {
    const info = RES[r];
    const w = document.createElement("div");
    w.className = "result-pop r" + r;
    w.innerHTML = '<div class="result-card"><div class="rays"></div><img src="' + artUrl(CAST.yut[r]) + '" alt="' + esc(nameOf(CAST.yut[r])) + '">' +
      '<div class="result-name">' + info.name + "!</div>" +
      '<div class="result-sub">' + info.emoji + " " + (info.animal ? info.animal + " · " : "") + info.steps + (Yut.RESULTS[r].again ? " · 한 번 더!" : "") + "</div></div>";
    document.body.appendChild(w);
    SFX.result(r);
    TTS.say(info.say);
    let done = false;
    const close = () => {
      if (done) return;
      done = true;
      w.classList.add("out");
      setTimeout(() => { w.remove(); res(); }, 200 * SPEED);
    };
    w.addEventListener("click", close);
    setTimeout(close, (r >= 4 ? 1600 : 1250) * SPEED);
  });
}

/* ---------- 두기 ---------- */
async function doMove(id) {
  if (G.busy || !G.s) return;
  const m = G.moves.find(x => x.id === id);
  if (!m) return;
  G.busy = true;
  G.moves = [];
  $("#dests").innerHTML = "";
  $$(".unit.can, .unit.sel").forEach(e => e.classList.remove("can", "sel"));
  const prev = G.s;
  const r = Yut.applyMove(prev, id, m.unit === "new" ? G.newPick : undefined);
  G.s = r.state;
  persist();
  renderTop();
  renderPending(); // 방금 쓴 결과는 바로 칩에서 뺀다
  try { await playEvents(r.events, prev); } catch (e) { console.error(e); }
  G.newPick = null;
  G.sel = null;
  G.busy = false;
  afterAction();
}
async function playEvents(events, prev) {
  for (const e of events) {
    if (current !== "game") return;
    if (e.type === "move") await animMove(e, prev);
    else if (e.type === "capture") await animCapture(e, prev);
    else if (e.type === "stack") await animStack(e, prev);
    else if (e.type === "evolve") await animEvolve(e);
    else if (e.type === "wild") await animWild(e);
    else if (e.type === "finish") await animFinish(e);
    else if (e.type === "bonus") { SFX.again(); await banner("물리쳤으니 한 번 더!", null, 1000, "gold"); }
    else if (e.type === "skip") await animSkip(e);
    else if (e.type === "turn") { renderAll(); await announceTurn(e.team); }
    else if (e.type === "win") await showWin(e.team);
    else if (EVENT_ANIM[e.type]) await EVENT_ANIM[e.type](e, prev);
  }
}
async function animMove(e, prev) {
  let el;
  if (e.unit === "new") {
    el = unitEl(prev, e.team, 0, e.pieces);
    el.classList.add("enter");
    $("#units").appendChild(el);
    renderPanelFrom(prev, e.pieces);
    SFX.pop();
    await sleep(340);
  } else {
    el = unitAt(e.team, e.from.node);
    if (!el) { el = unitEl(prev, e.team, e.from.node, e.pieces); $("#units").appendChild(el); }
  }
  el.classList.remove("can", "sel");
  el.classList.add("moving");
  if (e.fly && e.path.length) {                // 🦅 공중날기: 한 번에 훨훨
    el.classList.add("flying");
    SFX.throwBall();
    placeAt(el, e.path[e.path.length - 1]);
    await sleep(650);
    el.classList.remove("flying");
  } else for (let k = 0; k < e.path.length; k++) {
    placeAt(el, e.path[k]);
    el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
    SFX.hop(k);
    await sleep(e.back || e.result < 0 ? 420 : 250);
  }
  el.classList.remove("moving", "hop", "enter");
  el.dataset.node = e.finish ? 0 : e.to.node; // 골인한 말은 참먹이(0)에 서 있다가 빠져나간다
  G.lastEl = el;
}
// 새 말이 나가는 순간 패널의 그 칸만 먼저 "판 위"로 바꿔 보여 준다
function renderPanelFrom(prev, pieces) {
  pieces.forEach(i => { const c = $('.pchip[data-piece="' + i + '"]'); if (c) { c.classList.remove("wait", "can", "selected"); c.classList.add("board"); const b = c.querySelector(".ball"); if (b) b.remove(); } });
}
async function animCapture(e, prev) {
  const vTeam = prev.pieces[e.victims[0]].team;
  const vEl = unitAt(vTeam, e.node);
  fxAt(e.node, fxOf(Yut.formOf(prev, e.by[0])));
  await sleep(300);
  if (G.s.settings.battle === false) await quickBattle(e, prev); // 설정에서 "배틀 장면 건너뛰기"
  else await battle(e, prev);     // 배틀 화면
  if (current !== "game") return;
  if (vEl) {
    vEl.classList.add("going-home");
    placeAt(vEl, 0);              // 집 = 출발 자리(참먹이)
    SFX.runHome();
    await sleep(800);
    vEl.remove();
  }
  renderPanel();
}

/* ---------- 배틀: 상대 말이 있는 칸에 멈추면 기술로 물리친다 → 진 포켓몬은 집(출발 자리)으로 ---------- */
const backUrl = id => "assets/sprites/back/" + id + ".png";
// 96px 도트 그림을 무대 폭의 w% 로 키우고, 그림의 발(실제 그림 영역의 아래)을 (x%, footY%) 에 맞춘다.
// 포켓몬 게임처럼 그림 크기는 원래 비율 그대로 (작은 포켓몬은 작게)
function btSprite(id, back, x, footY, w, cls) {
  const b = ((back ? D.boxBack : D.box) || [])[id - 1] || [16, 16, 64, 64];
  const h = w * 16 / 9;                                  // 정사각형 칸의 높이 (무대 높이 %)
  const top = footY - (b[1] + b[3]) / 96 * h;
  const left = x - (b[0] + b[2] / 2) / 96 * w;
  return '<img class="bt-mon ' + cls + '" src="' + (back ? backUrl(id) : frontUrl(id)) + '" alt="' + esc(nameOf(id)) + '" draggable="false"' +
    ' style="left:' + left.toFixed(2) + "%;top:" + top.toFixed(2) + "%;width:" + w.toFixed(2) + '%"' +
    ' onerror="btFail(this,' + id + "," + (back ? 1 : 0) + ')">';
}
function btFail(img, id, back) {
  img.onerror = null;
  if (back) { img.src = frontUrl(id); img.style.transform = "scaleX(-1)"; }   // 뒷모습이 없으면 앞모습을 뒤집어서
  else img.src = "assets/items/poke-ball.png";
}
function btPlate(side, name, team, extra) {
  return '<div class="bt-plate ' + side + '" style="--tc:' + team.color + '"><div class="bp-top"><b>' + esc(name) + "</b>" + (extra || "") + "<em>" + esc(team.name) + "</em></div>" +
    '<div class="bp-hp"><span>HP</span><i class="hpbar"><i class="fill"></i></i></div></div>';
}
const WILD_TEAM = { name: "🌿 야생", color: "#3a9d4f" };
const RARITY_KO = { r: "레어", u: "유니크", l: "전설" };
const SHAKE_FRAMES = [
  { transform: "translateX(0)", filter: "none" }, { transform: "translateX(-7%)", filter: "brightness(2.4)", offset: 0.15 },
  { transform: "translateX(6%)", offset: 0.35 }, { transform: "translateX(-5%)", filter: "brightness(1.8)", offset: 0.55 },
  { transform: "translateX(4%)", offset: 0.75 }, { transform: "translateX(0)", filter: "none" }];

/* ---------- 배틀 무대 — 상대 말과의 배틀 · ❓ 풀숲 야생 조우가 같이 쓴다 ----------
   o: { foes: [id], foeTeam, foeExtra(이름 옆 표시), ally: id, allyTeam, allyLater(내 포켓몬은 나중에 등장) } */
function openStage(o) {
  const n = o.foes.length;
  const fw = n > 1 ? 20 : 25;                                // 업힌 말과 붙으면 여럿이 조금 작게 나란히
  const offs = n === 1 ? [0] : n === 2 ? [-7, 7] : [-11, 0, 11];
  const foeXY = o.foes.map((_, k) => [72 + offs[k], 59 + (k % 2) * 2]);
  const el = document.createElement("div");
  el.className = "battle";
  el.innerHTML =
    '<div class="bt-stage">' +
      '<i class="bt-pad foe"></i><i class="bt-pad ally"></i>' +
      o.foes.map((id, k) => btSprite(id, false, foeXY[k][0], foeXY[k][1], fw, "foe")).join("") +
      btSprite(o.ally, true, 27, 94, 33, "ally") +
      btPlate("foe", o.foes.map(nameOf).join("·"), o.foeTeam, o.foeExtra) + btPlate("ally", nameOf(o.ally), o.allyTeam) +
      '<div class="bt-flash"></div><div class="bt-fx"></div><div class="bt-intro"></div>' +
    "</div>" +
    '<div class="bt-dialog"><p class="bt-text"></p><div class="bt-menu"></div><i class="bt-more">▼</i></div>' +
    '<button class="btn bt-skip">건너뛰기 ⏭</button>';
  document.body.appendChild(el);
  let resolveDone, typer = null, menuResolve = null;
  const c = {
    el, foeXY, n,
    stage: $(".bt-stage", el), fx: $(".bt-fx", el), text: $(".bt-text", el), dialog: $(".bt-dialog", el), menuEl: $(".bt-menu", el),
    foeEls: $$(".bt-mon.foe", el), allyEl: $(".bt-mon.ally", el),
    skip: false, closed: false,
  };
  c.done = new Promise(r => { resolveDone = r; });
  if (o.allyLater) { c.allyEl.style.opacity = "0"; $(".bt-plate.ally", el).style.opacity = "0"; }
  c.live = () => !c.skip;
  c.wait = ms => c.skip ? Promise.resolve() : sleep(ms);
  c.anim = (node, frames, ms, opt) => {
    if (!node || !node.animate || c.skip) return Promise.resolve();
    const a = node.animate(frames, Object.assign({ duration: ms * SPEED, fill: "forwards", easing: "ease-out" }, opt || {}));
    return a.finished ? a.finished.catch(() => {}) : sleep(ms);
  };
  c.put = (cls, html, x, y) => {
    const s = document.createElement("span");
    s.className = cls;
    s.innerHTML = html;
    s.style.left = x + "%"; s.style.top = y + "%";
    c.fx.appendChild(s);
    return s;
  };
  // 대화창: 한 글자씩 — 누르면 바로 다 보인다
  c.say = (msg, speak) => new Promise(res => {
    clearInterval(typer);
    c.menuEl.innerHTML = "";
    if (c.skip) { c.text.textContent = msg; return res(); }
    if (speak) TTS.say(msg);
    const chars = Array.from(msg);
    let i = 0;
    c.text.textContent = "";
    const done = () => { clearInterval(typer); c.text.textContent = msg; c.dialog.onclick = null; res(); };
    c.dialog.onclick = done;
    typer = setInterval(() => { i++; c.text.textContent = chars.slice(0, i).join(""); if (i >= chars.length) done(); }, Math.max(6, 34 * SPEED));
  });
  // 대화창 아래 DS 메뉴: [{ key, html, cls }] → 고른 key (건너뛰기면 null)
  c.menu = items => new Promise(res => {
    if (c.skip) return res(null);
    menuResolve = res;
    c.dialog.onclick = null;
    c.menuEl.innerHTML = items.map(it => '<button class="btn ' + (it.cls || "") + '" data-key="' + esc(it.key) + '">' + it.html + "</button>").join("");
    $$("button", c.menuEl).forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      menuResolve = null;
      c.menuEl.innerHTML = "";
      SFX.tap();
      res(b.dataset.key);
    }));
  });
  c.close = () => {
    if (c.closed) return;
    c.closed = true;
    clearInterval(typer);
    if (menuResolve) { const r = menuResolve; menuResolve = null; r(null); }
    el.classList.add("out");
    setTimeout(() => { el.remove(); resolveDone(); }, 260 * SPEED);
  };
  $(".bt-skip", el).addEventListener("click", ev => { ev.stopPropagation(); c.skip = true; TTS.stop(); c.close(); });
  return c;
}
// 기술: 달려들기 → 타입 이펙트 5개 → 타입 색 번쩍 + 💥 + 흔들림 + 상대 HP 0
async function stageAttack(c, atk) {
  if (c.live()) { SFX.attack(); Cry.play(atk); }
  c.anim(c.allyEl, [{ transform: "none" }, { transform: "translate(14%, -12%)", offset: 0.35 }, { transform: "none" }], 460);
  await c.wait(180);
  for (let k = 0; k < 5 && c.live(); k++) {
    const [tx, ty] = c.foeXY[k % c.n];
    const p = c.put("bt-proj", fxOf(atk), 32, 72);
    c.anim(p, [{ left: "32%", top: "72%", transform: "translate(-50%,-50%) scale(.5)" }, { left: tx + "%", top: (ty - 14) + "%", transform: "translate(-50%,-50%) scale(1.35)" }], 420, { easing: "ease-in" })
      .then(() => p.remove());
    await c.wait(90);
  }
  await c.wait(380);
  if (!c.live()) return;
  SFX.hit();
  const fl = $(".bt-flash", c.el);
  fl.style.background = D.typeColors[typesOf(atk)[0]] || "#ffcf40";
  c.anim(fl, [{ opacity: 0.75 }, { opacity: 0 }], 420, { fill: "none" });
  c.foeXY.forEach(([x, y]) => { const b = c.put("bt-burst", "💥", x, y - 14); c.anim(b, [{ transform: "translate(-50%,-50%) scale(.3)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(1.5)", opacity: 0 }], 520).then(() => b.remove()); });
  c.foeEls.forEach(el => c.anim(el, SHAKE_FRAMES, 520));
  const fill = $(".bt-plate.foe .fill", c.el);
  if (fill) fill.classList.add("low");
}
// 폴짝 뛰었다가 💨 오른쪽으로 달려 나간다 (배틀에 진 포켓몬은 집으로, 야생은 풀숲으로)
function stageRunOff(c) {
  c.foeEls.forEach((el, k) => {
    const [x, y] = c.foeXY[k];
    const puff = c.put("bt-proj", "💨", x - 8, y - 5);
    c.anim(puff, [{ transform: "translate(-50%,-50%) scale(.5)", opacity: 0.9 }, { transform: "translate(-120%,-50%) scale(1.3)", opacity: 0 }], 700).then(() => puff.remove());
    c.anim(el, [
      { transform: "none", opacity: 1 },
      { transform: "translateY(-18%)", offset: 0.25 },
      { transform: "translateY(0)", offset: 0.45 },
      { transform: "translateX(170%)", opacity: 0 }], 850, { easing: "ease-in", delay: k * 120 * SPEED });
  });
}
function stageStars(c, x, y) {
  ["✨", "⭐", "✨", "🌟", "✨"].forEach((s, i) => {
    const st = c.put("bt-star", s, x, y);
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    c.anim(st, [{ transform: "translate(-50%,-50%) scale(.3)", opacity: 1 }, { transform: "translate(calc(-50% + " + (Math.cos(a) * 110).toFixed(0) + "px), calc(-50% + " + (Math.sin(a) * 80).toFixed(0) + "px)) scale(1.1)", opacity: 0 }], 900).then(() => st.remove());
  });
}
// 볼 던지기: 포물선 → 번쩍 → 빨려 들어감 → 떨어짐 → res.shakes 번 흔들 → 딸깍(성공) / 튀어나옴(실패)
async function stageThrow(c, ball, res) {
  const [x, y] = c.foeXY[0];
  const b = document.createElement("img");
  b.className = "bt-ball";
  b.alt = "";
  b.src = "assets/items/" + Yut.Rewards.BALL_INFO[ball].img + ".png";
  b.style.left = "22%"; b.style.top = "82%";
  c.fx.appendChild(b);
  if (c.live()) SFX.throwBall();
  await c.anim(b, [
    { left: "22%", top: "82%", transform: "translate(-50%,-50%) rotate(0deg)" },
    { left: ((22 + x) / 2) + "%", top: "12%", transform: "translate(-50%,-50%) rotate(420deg)", offset: 0.5 },
    { left: x + "%", top: (y - 22) + "%", transform: "translate(-50%,-50%) rotate(760deg)" }], 640, { easing: "linear" });
  const fl = $(".bt-flash", c.el);
  if (c.live()) { fl.style.background = "#fff"; c.anim(fl, [{ opacity: 0.8 }, { opacity: 0 }], 300, { fill: "none" }); }
  await c.anim(c.foeEls[0], [
    { transform: "none", filter: "none", opacity: 1 },
    { transform: "none", filter: "brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(6)", offset: 0.35 },
    { transform: "translateY(-20%) scale(0)", filter: "brightness(3)", opacity: 0 }], 480, { easing: "ease-in" });
  await c.anim(b, [
    { left: x + "%", top: (y - 22) + "%", transform: "translate(-50%,-50%) rotate(760deg)" },
    { left: x + "%", top: (y - 4) + "%", transform: "translate(-50%,-50%) rotate(720deg)" }], 320, { easing: "cubic-bezier(.5,0,.6,1.6)" });
  await c.wait(260);
  for (let s = 0; s < res.shakes && c.live(); s++) {
    SFX.shake();
    await c.anim(b, [
      { transform: "translate(-50%,-50%) rotate(0deg)" }, { transform: "translate(-50%,-50%) rotate(-24deg)", offset: 0.3 },
      { transform: "translate(-50%,-50%) rotate(20deg)", offset: 0.7 }, { transform: "translate(-50%,-50%) rotate(0deg)" }], 400, { fill: "none" });
    await c.wait(180);
  }
  if (!c.live()) { b.remove(); return; }
  if (res.ok) {
    SFX.catchOk();
    stageStars(c, x, y - 4);
    c.stage.insertAdjacentHTML("beforeend", '<div class="bt-stamp">잡았다!</div>');
    return;
  }
  SFX.pop();
  fl.style.background = "#fff";
  c.anim(fl, [{ opacity: 0.7 }, { opacity: 0 }], 260, { fill: "none" });
  c.anim(b, [{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(1.8)", opacity: 0 }], 300).then(() => b.remove());
  await c.anim(c.foeEls[0], [
    { transform: "translateY(-20%) scale(0)", filter: "brightness(3)", opacity: 0 },
    { transform: "none", filter: "none", opacity: 1 }], 380, { easing: "cubic-bezier(.2,1.5,.4,1)" });
}

// 배틀 장면을 건너뛸 때: 윷판 위에서 💥 + 안내 칸 한 줄로 끝 (진 말이 집으로 가는 건 그대로)
async function quickBattle(e, prev) {
  const atk = Yut.formOf(prev, e.by[0]);
  const aTeam = prev.teams[prev.pieces[e.by[0]].team], vTeam = prev.teams[prev.pieces[e.victims[0]].team];
  const foeNames = e.victims.map(i => nameOf(Yut.formOf(prev, i))).join("·");
  SFX.attack();
  await sleep(220);
  SFX.hit();
  fxAt(e.node, "💥");
  const mv = e.skill ? skillName(e.skill) : moveOf(atk);
  toast(aTeam.cpu ? "로켓단이 " + josa(foeNames, "을/를") + " 물리쳤다옹~! 😼"
    : vTeam.cpu ? nameOf(atk) + "의 " + mv + "! 로켓단의 " + josa(foeNames, "을/를") + " 물리쳤다!"
    : nameOf(atk) + "의 " + mv + "! " + josa(foeNames, "을/를") + " 물리쳤다!", 2400);
  TTS.say(aTeam.cpu ? "로켓단이 물리쳤다옹!" : "물리쳤다!");
  await sleep(650);
}

/* ---------- 배틀: 상대 말이 있는 칸에 멈추면 — 기술로 물리친다 → 진 포켓몬은 집(출발 자리)으로 ---------- */
function battle(e, prev) {
  const atk = Yut.formOf(prev, e.by[0]);
  const aTeam = prev.teams[prev.pieces[e.by[0]].team];
  const vTeam = prev.teams[prev.pieces[e.victims[0]].team];
  const foes = e.victims.map(i => Yut.formOf(prev, i));
  const foeNames = foes.map(nameOf).join("·");
  const c = openStage({ foes, foeTeam: vTeam, ally: atk, allyTeam: aTeam });
  (async () => {
    // ① 등장: 줄무늬 섬광 → 양쪽에서 미끄러져 들어옴
    SFX.battle();
    c.foeEls.forEach(el => c.anim(el, [{ transform: "translateX(90%)", opacity: 0 }, { transform: "none", opacity: 1 }], 520));
    c.anim(c.allyEl, [{ transform: "translateX(-90%)", opacity: 0 }, { transform: "none", opacity: 1 }], 520);
    await c.wait(600);
    if (c.live()) Cry.play(foes[0]);
    await c.say("앗! " + vTeam.name + "의 " + josa(foeNames, "와/과") + " 마주쳤다!");
    await c.wait(550);
    // ② 기술
    await c.say(nameOf(atk) + "의 " + (e.skill ? skillName(e.skill) : moveOf(atk)) + "!", true);
    await stageAttack(c, atk);
    await c.wait(750);
    await c.say(josa(foeNames, "은/는") + " 힘이 쭉 빠졌다!");
    await c.wait(450);
    // ③ 물리쳤다!
    if (c.live()) {
      SFX.catchOk();
      stageStars(c, 27, 70);

function makeSpots(seed) {
  if (Q.get("spots") === "none") return []; // 테스트용: 풀숲 없이
  const forced = (Q.get("spots") || "").split(",").map(x => x.split(":").map(Number)).filter(x => x.length === 2 && Yut.NODES[x[0]] && x[1] >= 1 && x[1] <= 1025);
  if (forced.length) return forced.map(([node, id]) => ({ node, id }));
  // v4: 칸만 정해 두고 포켓몬은 멈춘 뒤에 뽑는다 (🕐 시계 문제를 맞히면 희귀도가 올라가서)
  return Yut.pickSpotNodes(Yut.rng((seed ^ 0x5eed) >>> 0), 2).map(node => ({ node, id: null }));
}
function startGame(teams, opts) {
  const seed = Q.get("seed") ? Number(Q.get("seed")) : (Math.floor(Math.random() * 2147483646) + 1);
  const lineRnd = Yut.rng((seed ^ 0xe7011) >>> 0);
  // 말의 진화 경로: 모두 마지막 모습까지 (로켓단도 — 또가스→또도가스, 나옹→페르시온. 처음부터 기술을 쓰면 불공평해서)
  teams = teams.map(t => Object.assign({}, t, { paths: t.picks.slice(0, opts.pieces).map(id => linePath(id, lineRnd)) }));
  // 기술 후보: 마지막 모습의 타입 기술. 전설(early)·진화 없음·2단계는 15칸에 배운다 (v4). 시험용 ?pools=nitro,surf|toxic,quake · ?early=1(모두 처음부터)
  const forcedPools = (Q.get("pools") || "").split("|").map(x => x.split(",").filter(k => Yut.SKILLS[k]));
  teams = teams.map((t, ti) => Object.assign({}, t, {
    early: t.paths.map(p => p.some(x => rarityOf(x) === "l")),
    now: t.paths.map(() => Q.get("early") === "1"),
    pools: t.paths.map((p, k) => (forcedPools[ti] && forcedPools[ti][k]) ? [forcedPools[ti][k]] : poolFor(p[p.length - 1])),
  }));
  const s = Yut.newGame({
    pieces: opts.pieces, backdo: opts.backdo, seed, first: opts.first || 0, skills: opts.skills !== false,
    mode: opts.mode, cpuLevel: opts.cpuLevel, battle: opts.battle, teams, spots: makeSpots(seed),
  }, D.evoFrom);

function swapInfo(id) {
  const path = linePath(id, Math.random);
  const early = path.some(x => rarityOf(x) === "l");
  const forced = Q.get("swappool"); // 시험용
  return { id, path, base: Math.max(0, path.indexOf(id)), early, pool: forced && Yut.SKILLS[forced] ? [forced] : poolFor(path[path.length - 1]) };
}
// 조우 무대 안: "지금 말로 쓸까요?" → 바꿀 말 고르기 → "돌아와! 가라!"
async function offerSwap(c, e, id) {
  const s = G.s, team = e.team, root = rootOf(id), name = nameOf(id);
  const cands = s.pieces.map((p, i) => i).filter(i => s.pieces[i].team === team && Yut.swapOk(s, i, root));
  if (!cands.length) { await c.say("판 위에 " + nameOf(root) + " 가족이 있어서 지금은 말로 못 써요."); await c.wait(900); return false; }
  await c.say(josa(name, "을/를") + " 지금 말로 쓸까요? 바꿀 말을 골라요!", true);
  const tag = i => { const p = s.pieces[i]; return p.skill && p.used ? " <em>✨ 다 씀</em>" : p.state === "wait" ? ' <em class="home">집</em>' : ""; };
  const pick = await c.menu(cands.map(i => ({ key: String(i), cls: "bt-swapbtn", html: '<span class="sw-pic">' + spr(Yut.formOf(s, i)) + "</span>" + esc(nameOf(Yut.formOf(s, i))) + tag(i) }))
    .concat([{ key: "later", cls: "ghost", html: "나중에 (보관함에)" }]));
  if (!pick || pick === "later" || !c.live()) return false;
  const i = Number(pick);
  const old = Yut.formOf(G.s, i);
  const r = Yut.applySwap(G.s, i, swapInfo(id));
  G.s = r.state;
  persist();
  await c.say("돌아와, " + nameOf(old) + "!");
  if (e.pieces[0] === i && c.allyEl) { // 무대에 선 포켓몬이 바로 그 말이면 모습도 바꾼다
    await c.anim(c.allyEl, [{ transform: "none", opacity: 1, filter: "none" }, { transform: "scale(.2)", opacity: 0, filter: "brightness(3)" }], 420);
    c.allyEl.insertAdjacentHTML("afterend", btSprite(id, true, 27, 94, 33, "ally"));

    c.allyEl.remove();
    c.allyEl = nx;

    const plate = $(".bt-plate.ally b", c.el);
    if (plate) plate.textContent = name;
  }
  await c.say("가라, " + name + "! 🔄", true);
  await c.wait(700);
  G.swapAfter = { piece: i, events: r.events.slice(1), from: old, to: id };
  return true;
}

const STUDY_COLORS = ["#e5484d", "#f28c28", "#2fa35a", "#2f6fd6"]; // 사진 속 시계처럼 빨·주·초·파 돌아가며 (12=빨강, 1=주황, 2=초록, 3=파랑 …)
const studyOn = () => (G.s && G.s.settings.study === false) ? false : (G.s ? true : Setup.study !== false);
function studyRecord(kind, ok) {
  const st = Store.data.study || (Store.data.study = {});

  Store.save();
}
const studyLevel = kind => ((Store.data.study || {})[kind] || {}).level || 1;
// 🕐 시계 — 알록달록 숫자 1~12, 바깥 분 숫자 0·5·…·55, 1분 눈금 60개. 시침 = 짧은 빨강, 분침 = 긴 파랑
function clockSvg(h, m) {
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [(Math.cos(a) * r).toFixed(2), (Math.sin(a) * r).toFixed(2)]; };
  let g = '<circle r="104" fill="#fff" stroke="#263147" stroke-width="6"/><circle r="97" fill="none" stroke="#dfeaf7" stroke-width="3"/>';
  for (let i = 0; i < 60; i++) {
    const big = i % 5 === 0, [x1, y1] = pt(i * 6, big ? 92 : 94), [x2, y2] = pt(i * 6, big ? 84 : 89);
    g += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (big ? STUDY_COLORS[(i / 5) % 4] : "#9fb0c6") + '" stroke-width="' + (big ? 3 : 1.6) + '" stroke-linecap="round"/>';
  }
  for (let i = 0; i < 12; i++) {
    const [x, y] = pt(i * 30, 76);
    g += '<text x="' + x + '" y="' + y + '" class="ck-min" fill="' + STUDY_COLORS[i % 4] + '">' + (i * 5) + "</text>";
    const n = i === 0 ? 12 : i, [X, Y] = pt(i * 30, 54);
    g += '<text x="' + X + '" y="' + Y + '" class="ck-hr" fill="' + STUDY_COLORS[n % 4] + '">' + n + "</text>";
  }
  const hd = (h % 12) * 30 + m * 0.5, md = m * 6;
  g += '<g class="hand-m" transform="rotate(' + md + ')"><line x1="0" y1="10" x2="0" y2="-80" stroke="#2f6fd6" stroke-width="6" stroke-linecap="round"/></g>';
  g += '<g class="hand-h" transform="rotate(' + hd + ')"><line x1="0" y1="8" x2="0" y2="-44" stroke="#e5484d" stroke-width="11" stroke-linecap="round"/></g>';
  g += '<circle r="8" fill="#263147"/><circle r="3" fill="#fff"/>';
  return '<svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="시계">' + g + "</svg>";
}

function quizWindow(o) {

        '<div class="qz-explain" aria-live="polite"></div>' +
        '<button class="btn big green qz-next" hidden>알겠어요!</button></div>' +

    TTS.say(plain(o.say || o.question));
    const btns = $$(".qz-choice", el), ex = $(".qz-explain", el), next = $(".qz-next", el);
    let done = false;
    const close = ok => { el.classList.add("out"); setTimeout(() => { el.remove(); res({ ok }); }, 220 * SPEED); };
    btns.forEach(b => b.addEventListener("click", async () => {
      if (done) return;

        await sleep(1500);
        close(true);
        return;
      }
      b.classList.add("wrong");
      SFX.pop();
      TTS.say("아쉽다! 같이 볼까요?");
      await sleep(500);
      const steps = o.explain();
      for (const st of steps) {

      next.focus();
      next.addEventListener("click", () => { SFX.tap(); close(false); }, { once: true });
    }));
  });
}
// 숫자 뒤 조사: 3을·2를, 3과·4와 (숫자를 읽은 소리의 받침으로)
const nj = (n, pair) => { const d = n % 10, jong = [0, 1, 3, 6, 7, 8].indexOf(d) >= 0; const [a, b] = pair.split("/"); return n + (jong ? a : b); };
function clockExplain(h, m) {
  const next = h === 12 ? 1 : h + 1, k = Math.floor(m / 5), extra = m % 5, num = k === 0 ? 12 : k;
  const hourText = m === 0 ? "짧은 <b class='hr'>빨간 바늘</b>이 <b>" + nj(h, "을/를") + "</b> 가리켜요 → <b>" + h + "시</b>"
    : "짧은 <b class='hr'>빨간 바늘</b>이 <b>" + nj(h, "과/와") + "</b> <b>" + next + "</b> 사이 → 아직 <b>" + h + "시</b>예요";
  const minText = m === 0 ? "긴 <b class='mn'>파란 바늘</b>이 <b>12</b>(0분)에 있으면 → <b>정각</b>"
    : extra === 0 ? "긴 <b class='mn'>파란 바늘</b>이 <b>" + nj(num, "을/를") + "</b> 가리켜요 → " + num + " × 5 = <b>" + m + "분</b>"
    : "긴 <b class='mn'>파란 바늘</b>이 <b>" + (k * 5) + "분</b>에서 작은 눈금 <b>" + extra + "칸</b> 더 → <b>" + m + "분</b>";
  return [{ hl: ".hand-h", text: hourText }, { hl: ".hand-m", text: minText }, { text: "정답은 <b>" + Yut.Study.clockText({ h, m }) + "</b>!" }];
}
// ❓ 풀숲: 시계를 맞히면 이번 조우만 희귀도 30·30·20·20 → true

// 🌿 풀숲 포켓몬을 이제 뽑는다 (시계를 맞혔으면 30·30·20·20). 뽑은 즉시 저장 — 새로고침으로 다시 뽑기 불가
function rollSpot(e, boosted) {
  const sp = (G.s.spots || []).find(x => x.node === e.node);
  if (sp && sp.id) { e.id = sp.id; return e.id; }
  const other = (G.s.spots || []).map(x => x.id).filter(Boolean), owned = ownedSet();
  let id, tries = 0;
  do { id = Yut.Rewards.rollWild(WILD_POOLS, owned, Math.random, boosted ? Yut.Rewards.WILD_ODDS_BOOST : null); } while (other.indexOf(id) >= 0 && ++tries < 10);
  if (sp) sp.id = id;
  e.id = id;
  persist();
  return id;
}
// 💰 보물상자 바닥: 돈 문제 → 볼 하나 더 (틀리면 풀이 보고 새 문제로 한 번 더, 두 번째에 맞히면 몬스터볼)
function moneyExplain(q) {
  const rows = Yut.Study.UNITS.filter(u => q.counts[u] > 0).map(u =>
    ({ text: MONEY_UI[u].name + " " + q.counts[u] + MONEY_UI[u].n + " → <b>" + Yut.Study.won(u * q.counts[u]) + "</b>" }));
  return rows.concat([{ text: "모두 <b>" + Yut.Study.won(q.total) + "</b> (" + Yut.Study.koNum(q.total) + " 원)" }]);
}
async function moneyQuizOnce(retry) {
  const f = (Q.get("money") || "").split(",").map(Number);
  const forced = !retry && f.length === 4 && f.every(x => x >= 0 && x <= 9) ? { 100000: f[0], 10000: f[1], 1000: f[2], 100: f[3] } : null;
  const q = Yut.Study.money(studyLevel("money"), Math.random, forced);
  const r = await quizWindow({
    kind: "money", level: studyLevel("money"),
    title: retry ? "💰 한 번 더! 이번엔 맞힐 수 있어요" : "🎁 상자 바닥에 뭔가 더 있다! 💰 돈 문제를 풀면 <b>볼 하나 더</b>!",
    body: moneyHtml(q.counts), question: "모두 얼마일까요?",
    say: retry ? "한 번 더! 모두 얼마일까요?" : "돈 문제를 풀면 볼 하나 더! 모두 얼마일까요?",
    choices: q.choices.map(Yut.Study.won), answer: q.answer,
    okText: "정답! " + Yut.Study.won(q.total) + " (" + Yut.Study.koNum(q.total) + " 원)",
    explain: () => moneyExplain(q),
  });
  studyRecord("money", r.ok);
  return r.ok;
}
function bonusHtml(rw) {
  if (!rw || !rw.opened || !G.s || G.s.settings.study === false) return "";
  if (rw.bonus) return '<div class="bonus-zone" id="bonus-zone"><p class="box-hint">' + (rw.bonus.ball ? "💰 돈 문제 보너스!" : "💰 돈 문제 — 다음엔 꼭!") + "</p></div>";
  return '<div class="bonus-zone" id="bonus-zone"><button class="btn big gold cursor" data-act="money-quiz">💰 돈 문제 풀고 볼 하나 더!</button></div>';
}
async function moneyBonus() {
  const rw = G.s && G.s.reward;
  if (!rw || !rw.opened || rw.bonus || G.moneyBusy) return;
  G.moneyBusy = true;
  let ball = null;
  if (await moneyQuizOnce(false)) ball = Yut.Rewards.rollBox(1, Math.random)[0];
  else if (await moneyQuizOnce(true)) ball = "poke";
  // 결과를 먼저 저장 (새로고침해도 두 번 안 받게)
  rw.bonus = { ball };
  if (ball) Store.data.bag[ball] = (Store.data.bag[ball] || 0) + 1;
  Store.data.lastGame = G.s;
  Store.save();
  G.moneyBusy = false;
  const zone = $("#bonus-zone");
  if (zone) zone.outerHTML = bonusHtml(rw);
  if (ball) {
    const list = $("#box-balls");
    if (list) list.insertAdjacentHTML("beforeend", ballChip(ball, true));
    SFX.catchOk(); confetti(30);
    TTS.say(Yut.Rewards.BALL_INFO[ball].name + " 하나 더! 가방에 넣었어요");
  }
  const btns = $(".win-btns");
  if (btns) btns.classList.remove("hidden");
}

/* ---------- 쉬기·그만두기 ---------- */
function openPause() {
  if (!G.s || current !== "game") return;
  G.paused = true;
  clearTimeout(G.cpuTimer);
  showModal(
    '<h2>⏸ 잠깐 쉬어요</h2><p>판은 자동으로 저장돼요.<br>나갔다 와도 <b>이어하기</b>로 계속할 수 있어요.</p>' +
    '<div class="btns"><button class="btn big green" data-act="close-modal">▶ 계속하기</button>' +
    '<button class="btn big" data-act="pause-home">🏠 처음 화면으로</button>' +
    '<button class="btn" data-act="pause-giveup">🏳️ 이 판 그만두기</button></div>',
    () => { G.paused = false; if (current === "game" && !G.busy) afterAction(); }
  );
}
// 되돌릴 수 없는 일은 글자를 직접 써야 실행된다
function typedConfirm(title, text, word, onYes) {
  showModal(
    "<h2>" + esc(title) + "</h2><p>" + text + '<br>아래 칸에 <b>' + esc(word) + "</b> 라고 써 주세요.</p>" +
    '<input id="confirm-in" autocomplete="off" spellcheck="false" placeholder="' + esc(word) + '">' +
    '<div class="btns"><button class="btn big red" id="confirm-yes" disabled>' + esc(title) + '</button><button class="btn" data-act="close-modal">취소</button></div>',
    () => { G.paused = false; if (current === "game" && !G.busy) afterAction(); }
  );
  const inp = $("#confirm-in"), yes = $("#confirm-yes");
  inp.addEventListener("input", () => { yes.disabled = inp.value.trim() !== word; });
  yes.addEventListener("click", () => { if (inp.value.trim() === word) { modalClose = null; closeModal(); onYes(); } });
  setTimeout(() => inp.focus(), 60);
}
window.addEventListener("popstate", () => {
  // 브라우저 뒤로 가기: 게임 중이면 바로 나가지 않고 "잠깐 쉬어요"
  if (current === "game") { try { history.pushState({ yut: "game" }, ""); } catch (e) {} if (!$("#overlay").classList.contains("show")) openPause(); }
});

/* ---------- 도움말 ---------- */
function openRules() {
  showModal(
    "<h2>📖 윷놀이 방법</h2>" +
    '<div class="rules-res">' + [1, 2, 3, 4, 5, -1].map(r =>
      '<div><img src="' + artUrl(CAST.yut[r]) + '" alt=""><b>' + RES[r].name + "</b>" + (RES[r].animal ? RES[r].emoji + " " + RES[r].animal + " · " : "") + RES[r].steps + "</div>").join("") + "</div>" +
    '<ul class="rules-list">' +
      "<li>🎲 <b>윷</b>이나 <b>모</b>가 나오면 한 번 더 던져요.</li>" +
      "<li>🏁 <b>참먹이</b>(오른쪽 아래)에서 출발해 판을 돌아 다시 참먹이로 오면 <b>골인</b>!</li>" +
      "<li>↗️ <b>위쪽 두 모서리</b>나 가운데 <b>방</b>에 딱 멈추면 지름길(대각선)로 가요.</li>" +
      "<li>🤝 내 말끼리 같은 칸에 서면 <b>업어서</b> 같이 가요.</li>" +
      "<li>⚔️ 상대 말이 있는 칸에 멈추면 <b>배틀</b>! 기술로 물리치면 상대 포켓몬은 <b>집(출발 자리)</b>으로 돌아가고, 이긴 팀은 한 번 더!</li>" +
      "<li>✨ <b>5칸</b> 갈 때마다 포켓몬이 <b>진화</b>해요. 배틀에 지면 처음 모습으로 돌아가요.</li>" +
      "<li>📖 마지막 모습이 되면 <b>기술</b>을 하나 배워요 — 진화가 짧거나 없는 포켓몬·전설은 <b>15칸</b>을 가야 해요. 내 차례에 <b>✨ 기술</b> 버튼으로 써요 — 말마다 한 판에 한 번, 한 차례에 하나!</li>" +
      "<li>🕐 풀숲에서 <b>시계</b>를 맞히면 유니크·전설 포켓몬이 더 잘 나와요. 💰 로켓단을 이기면 <b>돈 문제</b>로 볼 하나 더!</li>" +
      "<li>🌿 윷판의 <b>❓ 풀숲</b>에 딱 멈추면 야생 포켓몬! 볼로 잡으면 <b>그 자리에서 바로</b> 내 말과 바꿀 수 있어요. 기술을 다 쓴 말과 바꾸면 새 기술을 또 써요!</li>" +
      "<li>😼 로켓단도 풀숲에서 그물로 포켓몬을 잡아 가요. 먼저 가서 잡아요!</li>" +
      "<li>🎁 로켓단을 이기면 <b>보물상자</b>에서 볼 3개!</li>" +
      "<li>🏆 내 포켓몬이 먼저 전부 골인하면 이겨요!</li>" +
    "</ul>" +
    '<div class="btns"><button class="btn big green" data-act="close-modal">알겠어요!</button></div>'
  );
}
function openStats() {
  const st = Store.data.stats;
  const fam = MEMBERS.filter(m => st.family[m.key]).map(m => "<div><span>" + esc(m.name) + "</span><span>" + st.family[m.key] + "승</span></div>").join("");
  showModal(
    "<h2>🏆 전적</h2>" +
    "<p>가족 대결</p>" + '<div class="stats-list">' + (fam || "<div><span>아직 기록이 없어요</span><span></span></div>") + "</div>" +
    "<p>로켓단 대결</p>" + '<div class="stats-list"><div><span>😊 이겼어요</span><span>' + st.rocket.win + '번</span></div><div><span>😼 로켓단이 이겼어요</span><span>' + st.rocket.lose + "번</span></div></div>" +
    "<p>모두 " + (st.games || 0) + "판</p>" +
    "<p>🎓 공부</p>" + '<div class="stats-list">' + [["clock", "🕐 시계"], ["money", "💰 돈"]].map(([k, n]) => {
      const x = (Store.data.study || {})[k] || {};
      return "<div><span>" + n + " · " + (x.level || 1) + "단계</span><span>" + (x.right || 0) + "/" + (x.total || 0) + "</span></div>";
    }).join("") + "</div>" +
    '<div class="btns"><button class="btn big green" data-act="close-modal">닫기</button><button class="btn" data-act="stats-clear">🗑️ 전적 지우기</button></div>'
  );
}
/* ================================================================
   누르기 처리 (data-act)
================================================================ */
const Act = {
  "home": () => showScreen("home"),
  "resume": () => { G.s = Store.data.game; if (!G.s) return showScreen("home"); showScreen("game"); },
  "new-family": () => { Setup.mode = "family"; showScreen("setup"); },
  "new-rocket": () => { Setup.mode = "rocket"; showScreen("setup"); },
  "rules": openRules,
  "bag": openBag,
  "open-box": openBox,
  "money-quiz": moneyBonus,
  "stats": openStats,
  "sound": () => { Store.data.sound = Store.data.sound === false; Store.save(); const b = $("#sound-btn"); if (b) b.textContent = soundLabel(); if (Store.data.sound) SFX.tap(); else TTS.stop(); },
  "sound-game": () => { Act.sound(); const b = $("#sound-icon"); if (b) b.textContent = Store.data.sound === false ? "🔇" : "🔊"; },
  "set": el => {
    const v = JSON.parse(el.dataset.value);
    Setup[el.dataset.field] = v;
    const sc = $(".scroll"), top = sc ? sc.scrollTop : 0;
    showScreen("setup");
    const sc2 = $(".scroll"); if (sc2) sc2.scrollTop = top;
    SFX.tap();
  },
  "to-pick": () => {
    Setup.ti = 0;
    Setup.picks = [[], []];
    Setup.picks[0] = validPicks(Store.data.lastPicks[Setup.t0], 0);
    if (Setup.mode === "family") Setup.picks[1] = validPicks(Store.data.lastPicks[Setup.t1], 1);
    showScreen("pick");
  },
  "pick": el => {
    const id = Number(el.dataset.id), mine = Setup.picks[Setup.ti];
    const k = mine.indexOf(id);
    if (k >= 0) mine.splice(k, 1);
    else if (sameFamily(mine, id)) { toast(nameOf(rootOf(id)) + " 가족은 벌써 골랐어요! 한 가족에서 한 마리만 골라요", 2400); return; }
    else if (mine.length >= Setup.pieces) { toast("벌써 " + Setup.pieces + "마리를 골랐어요. 위에서 하나 빼고 골라요"); return; }
    else { mine.push(id); SFX.pop(); }
    updatePick();
  },
  "slot-remove": el => { Setup.picks[Setup.ti].splice(Number(el.dataset.k), 1); SFX.tap(); updatePick(); },
  "pick-auto": () => { autoPick(); SFX.pop(); updatePick(); },
  "pick-next": () => {
    if (Setup.picks[Setup.ti].length < Setup.pieces) return;
    if (Setup.mode === "family" && Setup.ti === 0) {
      Setup.ti = 1;
      Setup.picks[1] = validPicks(Setup.picks[1], 1);
      showScreen("pick");
    } else startFromSetup();
  },
  "pick-back": () => { if (Setup.ti === 1) { Setup.ti = 0; showScreen("pick"); } else showScreen("setup"); },
  "throw": () => { if (humanTurn()) doThrow(); },
  "skill": () => openSkillMenu(),
  "skill-pick": el => { closeModal(); beginSkill(Number(el.dataset.piece)); },
  "skill-target": el => { const i = G.skillPiece; closeModal(); if (i != null) doSkill(i, JSON.parse(el.dataset.v)); },
  "skill-cancel": () => { SFX.tap(); afterAction(); },
  "skilldex": openSkillDex,
  "chip": el => onChipTap(Number(el.dataset.piece)),
  "pause": openPause,
  "pause-home": () => { modalClose = null; closeModal(); G.paused = false; showScreen("home"); },
  "pause-giveup": () => typedConfirm("판 그만두기", "이 판을 지우면 되돌릴 수 없어요.", "그만", () => {
    Store.data.game = null; Store.save(); G.s = null; G.paused = false; showScreen("home"); toast("판을 정리했어요");
  }),
  "stats-clear": () => typedConfirm("전적 지우기", "전적을 모두 지우면 되돌릴 수 없어요.", "지우기", () => {
    Store.data.stats = Store.defaults().stats; Store.save(); toast("전적을 지웠어요");
  }),
  "rematch": rematch,
  "win-home": () => showScreen("home"),
  "close-modal": closeModal,
  "app-update": () => location.replace(location.pathname + "?v=" + Date.now()),
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const f = Act[el.dataset.act];
  if (f) f(el, e);
});

/* ================================================================
   새 버전 알림 — 패드가 옛 파일을 붙들고 있으면 알려 준다
================================================================ */
let updateChecked = false;
async function checkUpdate() {
  if (updateChecked || !navigator.onLine || !/^https?:$/.test(location.protocol)) return; // file:// 은 건너뜀
  updateChecked = true;
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const m = /APP_VERSION\s*=\s*"([^"]+)"/.exec(await r.text());
    if (!m || m[1] === APP_VERSION) return;
    showModal(
      '<h2>🎁 새 버전이 나왔어요!</h2><p>지금 <b>v' + esc(APP_VERSION) + "</b> 을 쓰고 있어요.<br>새 버전 <b>v" + esc(m[1]) + "</b> 으로 바꿔 볼까요?</p>" +
      '<div class="btns"><button class="btn big green" data-act="app-update">🔄 새 버전으로 바꾸기</button><button class="btn" data-act="close-modal">나중에</button></div>'
    );
  } catch (e) { /* 오프라인이면 조용히 */ }
}

/* ================================================================
   시작
================================================================ */
Store.load();
Object.assign(Setup, {
  t0: Store.data.settings.t0, t1: Store.data.settings.t1, cpu: Store.data.settings.cpu,
  pieces: Store.data.settings.pieces, backdo: Store.data.settings.backdo, battle: Store.data.settings.battle !== false,
  skills: Store.data.settings.skills !== false, study: Store.data.settings.study !== false,
});
if (Setup.t0 === Setup.t1) Setup.t1 = Setup.t0 === "mom" ? "kid" : "mom";
TTS.init();
Art.load();
showScreen("home");
window.__yut = { G, Store, Art, Setup, Yut, Act }; // 테스트용
</script>
